component:
  id: COMP-EUR-02
  name: Digital Euro Alias Service
  description: >
    A privacy-preserving oracle that maps hashed identifiers to routing information.
    Operated as a high-performance, blinded lookup service by the Eurosystem.
  role: privacy-oracle
  ownership: eurosystem
  
implementation:
  technology_stack:
    language: rust
    version: "1.75"
    framework: tokio


interfaces:
  exposed:
    - id: I_Alias_Resolution
      protocol: gRPC
      role: server

# The version each specification set is built against is declared here, once,
# the way a lockfile pins a library. Annotations in the source carry the
# identifier only. A set marked :TBD has no upstream artefact yet, so there is
# no version to pin.
depends_on:
  - set: SPEC-ALIAS-LOOKUP:TBD
    version: null        # not yet assigned
  - set: SPEC-PRIVACY-OPS:TBD
    version: null        # not yet assigned
  - set: SPEC-ALIAS-T01:TBD
    version: null        # not yet assigned
