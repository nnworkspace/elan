# traceability, and mechanical governance across distinct institutional boundaries.
# This structure enables automated compliance verification and live impact analysis.

component:
  id: COMP-EUR-05
  name: Digital Euro Access Gateway
  description: >
    The canonical API surface of the DESP. Authenticates PSPs,
    validates schemas, and serves as the firewall for the core platform.
  role: integration-gateway
  ownership: national-central-banks

implementation:
  technology_stack:
    language: go
    version: "1.21"
    framework: stdlib-http


interfaces:
  exposed:
    - id: I_PSP_Gateway
      protocol: REST
      role: server
  consumed:
    - id: I_Settlement
      protocol: gRPC
      role: client

# The version each specification set is built against is declared here, once,
# the way a lockfile pins a library. Annotations in the source carry the
# identifier only. A set marked :TBD has no upstream artefact yet, so there is
# no version to pin.
depends_on:
  - set: SPEC-API-GW:TBD
    version: null        # not yet assigned
  - set: SPEC-SEC-OPS:TBD
    version: null        # not yet assigned
