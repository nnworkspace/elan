component:
  id: COMP-PSP-01
  name: Payment Service Provider Mock 1
  description: >
    A reference implementation of a generic Payment Service Provider (PSP)
    connecting to the Digital Euro scheme.
  role: payment-service-provider
  ownership: external-psp
  
implementation:
  technology_stack:
    language: typescript
    framework: express
    runtime: nodejs


interfaces:
  consumed:
    - id: API_SpecLink
      protocol: library
    - id: I_Access_Gateway
      protocol: REST

# The version each specification set is built against is declared here, once,
# the way a lockfile pins a library. Annotations in the source carry the
# identifier only. A set marked :TBD has no upstream artefact yet, so there is
# no version to pin.
depends_on:
  - set: SPEC-SET-ONB
    version: "1.0.0"
  - set: SPEC-SET-LIQ
    version: "0.1.0"
  - set: SPEC-PSP-CORE:TBD
    version: null        # not yet assigned
  - set: SPEC-PSP-TEST:TBD
    version: null        # not yet assigned
  - set: SPEC-PAYMENT-INIT:TBD
    version: null        # not yet assigned
